<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 400;
            margin-bottom: 30px;
            color: #e6edf3;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .links-list a {
            color: #8b949e;
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1px solid #21262d;
            transition: color 0.2s ease;
            font-size: 0.95em;
        }

        .links-list a:hover {
            color: #58a6ff;
        }

        .links-list a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cheat Sheets</h1>
        <div class="links-list">

            <a href="https://daredumidu.github.io/ds_cheat_sheets/docker_commands.txt" target="_blank">Docker Commands</a>

            <a href="https://daredumidu.github.io/ds_cheat_sheets/powershell_commands.txt" target="_blank">PowerShell Commands</a>
            <a href="https://daredumidu.github.io/ds_cheat_sheets/windows_cheatsheet.txt" target="_blank">Windows Cheatsheet</a>
        </div>
    </div>
</body>
</html>
